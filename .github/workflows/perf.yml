name: perf A/B

# All routes use the same locked harness, runner, manifest and comparator.
# Automatic runs are schema/correctness smoke, NOT performance acceptance.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base ref or full SHA'
        default: 'integration-green'
      head_ref:
        description: 'Subject ref or full SHA; empty means workflow ref'
        default: ''
      reps:
        description: 'Interleaved base/head/base2 rounds'
        default: '6'
      iters:
        description: 'Actual samples per implementation per case per round'
        default: '7'
      size_mb:
        description: 'Decode corpus size in MiB (maximum 64)'
        default: '16'
      encode_mb:
        description: 'Encode corpus cap in MiB (maximum 64)'
        default: '4'
      real_corpus:
        description: 'Use recent corpus-prepare artifact; missing is explicitly NOT_RUN'
        type: boolean
        default: false
      config_leg:
        description: 'Separate default/tuned/default interleaved configuration suite'
        type: boolean
        default: false
      arm_crosscheck:
        description: 'Native arm64 Linux direction cross-check, not Android acceptance'
        type: boolean
        default: false
      fail_on_regression:
        description: 'Explicit performance gate; default green means data-complete only'
        type: boolean
        default: false
  push:
    branches: ['ci-perf*', 'perf/*', 'test/perf-contract']
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  actions: read

jobs:
  ab:
    name: bench A/B (data completeness, not automatic gain approval)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.arm_crosscheck) && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Resolve requested refs and bounded experiment
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE: ${{ inputs.base_ref }}
          INPUT_HEAD: ${{ inputs.head_ref }}
          INPUT_REPS: ${{ inputs.reps }}
          INPUT_ITERS: ${{ inputs.iters }}
          INPUT_SIZE: ${{ inputs.size_mb }}
          INPUT_ENCODE: ${{ inputs.encode_mb }}
        run: |
          python3 - <<'PY'
          import os
          event = os.environ['EVENT']
          if event == 'pull_request':
              base, head = os.environ['PR_BASE'], os.environ['PR_HEAD']
          else:
              base = os.environ['INPUT_BASE'] or 'integration-green'
              head = os.environ['INPUT_HEAD'] or os.environ['GITHUB_SHA']
          values = {'base': base, 'head': head}
          for key, env, full, smoke, cap in (
              ('reps', 'INPUT_REPS', 6, 3, 100), ('iters', 'INPUT_ITERS', 7, 3, 100),
              ('size', 'INPUT_SIZE', 16, 1, 64), ('encode', 'INPUT_ENCODE', 4, 1, 64)):
              number = int(os.environ[env] or (full if event == 'workflow_dispatch' else smoke))
              if not 1 <= number <= cap:
                  raise SystemExit('out-of-range input: ' + key)
              values[key] = number
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  if '\n' in str(value) or '\r' in str(value):
                      raise SystemExit('multiline input rejected')
                  output.write(f'{key}={value}\n')
          PY
      - name: Checkout measurement tooling
        uses: actions/checkout@v4
        with:
          path: tooling
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.base }}
          path: base
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.head }}
          path: head
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Copy the exact same locked measurement program into both subjects
        run: |
          mkdir -p base/tools/perf/harness head/tools/perf/harness build-records bins
          cp -R tooling/tools/perf/harness/. base/tools/perf/harness/
          cp -R tooling/tools/perf/harness/. head/tools/perf/harness/
          rustc -vV > build-records/rustc.txt
          cargo -V > build-records/cargo.txt
          git -C base rev-parse HEAD > build-records/base-source.txt
          git -C head rev-parse HEAD > build-records/head-source.txt
          git -C tooling rev-parse HEAD > build-records/tooling-source.txt
          diff -r base/tools/perf/harness head/tools/perf/harness
      - name: Pick a C compiler matching rustc's LLVM for the C reference
        id: ccpick
        continue-on-error: true
        run: |
          set -uo pipefail
          have() { command -v "$1" >/dev/null 2>&1; }
          want_major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
          echo "rustc bundled LLVM major: ${want_major:-unknown}"
          # 1) 已经在镜像里的同代 clang
          CC_PICK=""
          if [ -n "${want_major:-}" ] && have "clang-$want_major"; then
            CC_PICK="clang-$want_major"
          fi
          # 2) 没装到同代的就装（apt.llvm.org）；这一步失败才允许退回系统 clang
          if [ -z "$CC_PICK" ] && [ -n "${want_major:-}" ]; then
            codename=$(. /etc/os-release 2>/dev/null && echo "$VERSION_CODENAME")
            if curl -fsSL --max-time 60 https://apt.llvm.org/llvm-snapshot.gpg.key \
                 | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg 2>/dev/null \
               && echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${want_major} main" \
                 | sudo tee /etc/apt/sources.list.d/llvm${want_major}.list >/dev/null; then
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq "clang-${want_major}" || true
              have "clang-${want_major}" && CC_PICK="clang-${want_major}"
            fi
          fi
          # 3) 退路：系统 clang / cc，并把"不匹配"如实写进记录
          MISMATCH=""
          if [ -z "$CC_PICK" ]; then
            have clang && CC_PICK=clang
            MISMATCH="yes"
          fi
          : "${CC_PICK:=cc}"
          CXX_PICK="${CC_PICK/clang/clang++}"
          have "$CXX_PICK" || CXX_PICK="$CC_PICK"
          if [ -z "$CC_PICK" ] || [ "${CC_PICK#clang-}" = "$CC_PICK" ] || [ "${CC_PICK#clang-}" != "${want_major:-}" ]; then
            MISMATCH="yes"
          fi
          {
            echo "CC=$CC_PICK"
            echo "CXX=$CXX_PICK"
          } >> "$GITHUB_ENV"
          echo "cc=$CC_PICK" >> "$GITHUB_OUTPUT"
          echo "cc_mismatch=$MISMATCH" >> "$GITHUB_OUTPUT"
          {
            echo "=== compiler for C reference: $CC_PICK (llvm-major-match=${MISMATCH:-no}want=${want_major:-?}) ==="
            "$CC_PICK" --version | head -2 || true
            echo "=== rustc ==="
            rustc -vV
          } > build-records/cc.txt
          echo "C reference compiler: $CC_PICK (mismatch=${MISMATCH:-no})"
      - name: Cache measurement dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            base/tools/perf/harness -> ../../../../targets/base
            head/tools/perf/harness -> ../../../../targets/head
          # 编译器进 key：换 C 编译器必须让 zstd-sys 重新构建，不能复用旧 .a
          key: ccompiler-${{ steps.ccpick.outputs.cc }}
      - name: Build both locked release binaries
        run: |
          set -euo pipefail
          echo "CC=$CC CXX=$CXX" >> build-records/cc.txt
          (cd base/tools/perf/harness && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/targets/base" cargo build --locked --release) > build-records/base.log 2>&1
          (cd head/tools/perf/harness && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/targets/head" cargo build --locked --release) > build-records/head.log 2>&1
          cp targets/base/release/ruzstd-perf-harness bins/base
          cp targets/head/release/ruzstd-perf-harness bins/head
          sha256sum bins/base bins/head > build-records/binaries.sha256
      - name: Assert the C reference carries no hand-written assembly
        run: |
          set -uo pipefail
          {
            echo "=== C reference static libs ==="
          } > build-records/c-asm.txt
          status=0
          for side in base head; do
            lib=$(find "targets/$side" -name "libzstd.a" -path "*zstd-sys*" | head -1)
            if [ -z "$lib" ]; then
              echo "$side: libzstd.a NOT FOUND" | tee -a build-records/c-asm.txt
              status=1
              continue
            fi
            count=$(nm "$lib" 2>/dev/null | { grep -c "fast_asm_loop" || true; })
            hits=${count:-0}
            if [ "$hits" != "0" ]; then
              echo "$side: hand-written assembly present in C reference" | tee -a build-records/c-asm.txt
              status=1
            fi
          done
          if [ "$status" = "0" ]; then
            echo "PASS: C reference contains no huf_decompress*_fast_asm_loop" | tee -a build-records/c-asm.txt
          else
            echo "FAIL: hand-written assembly is present in the C reference" | tee -a build-records/c-asm.txt
            exit 1
          fi
      - name: Optional tuned binary, with explicit build status
        env:
          CONFIG: ${{ inputs.config_leg && 'true' || 'false' }}
        run: |
          printf 'NOT_RUN\n' > build-records/config.status
          if [ "$CONFIG" = true ]; then
            if (cd head/tools/perf/harness && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/targets/tuned" \
                CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 \
                RUSTFLAGS='-C target-cpu=native' cargo build --locked --release) > build-records/config.log 2>&1 && \
                cp targets/tuned/release/ruzstd-perf-harness bins/head_tuned; then
              printf 'COMPLETE\n' > build-records/config.status
            else
              printf 'FAILED\n' > build-records/config.status
              printf '::warning::configuration build FAILED; inspect build-records/config.log\n'
            fi
          fi
      - name: Optional recent real corpus, separate acquisition failure domain
        env:
          GH_TOKEN: ${{ github.token }}
          REAL: ${{ inputs.real_corpus && 'true' || 'false' }}
        run: |
          python3 tooling/tools/perf/fetch_corpus.py --output-dir "$GITHUB_WORKSPACE/corpus-cache" --enabled "$REAL"
      - name: Prepare deterministic LZ policy counterexamples
        run: python3 tooling/tools/perf/policy_corpus.py --output-dir "$GITHUB_WORKSPACE/policy-corpus"
      - name: Run immutable-plan interleaved suites
        env:
          REPS: ${{ steps.refs.outputs.reps }}
          ITERS: ${{ steps.refs.outputs.iters }}
          SIZE: ${{ steps.refs.outputs.size }}
          ENCODE: ${{ steps.refs.outputs.encode }}
        run: |
          set -euo pipefail
          EXTRA=()
          for file in "$GITHUB_WORKSPACE"/corpus-cache/*.bin "$GITHUB_WORKSPACE"/policy-corpus/*.bin; do
            [ -f "$file" ] || continue
            EXTRA+=(--corpus-file "$file")
          done
          if [ -x bins/head_tuned ]; then
            EXTRA+=(--tuned-bin "$GITHUB_WORKSPACE/bins/head_tuned")
          elif [ "$(< build-records/config.status)" = FAILED ]; then
            EXTRA+=(--config-failed 'tuned build failed; see build-records/config.log')
          fi
          python3 tooling/tools/perf/run_ab.py \
            --base-bin "$GITHUB_WORKSPACE/bins/base" --head-bin "$GITHUB_WORKSPACE/bins/head" \
            --base-source "$(git -C base rev-parse HEAD)" --head-source "$(git -C head rev-parse HEAD)" \
            --harness-dir "$GITHUB_WORKSPACE/tooling/tools/perf/harness" --repo-dir "$GITHUB_WORKSPACE/head" \
            --output-dir "$GITHUB_WORKSPACE/perf-results" --rounds "$REPS" --iters "$ITERS" \
            --size-mb "$SIZE" --encode-mb "$ENCODE" "${EXTRA[@]}"
      - name: Compare required data and explicitly requested performance gate
        if: always()
        env:
          GATE: ${{ inputs.fail_on_regression && 'true' || 'false' }}
        run: |
          EXTRA=()
          [ "$GATE" != true ] || EXTRA+=(--fail-on-regression)
          mkdir -p perf-results
          set +e
          python3 tooling/tools/perf/compare.py --manifest "$GITHUB_WORKSPACE/perf-results/manifest.json" \
            --data-dir "$GITHUB_WORKSPACE/perf-results" --output "$GITHUB_WORKSPACE/perf-results/report.json" \
            --summary "$GITHUB_WORKSPACE/perf-results/report.md" --min-effect-pct 1.0 "${EXTRA[@]}"
          status=$?
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              report = Path('perf-results/report.md')
              out.write(report.read_text() if report.exists() else 'Required A/B FAILED before report generation.\n')
              corpus = Path('corpus-cache/status.json')
              out.write('\nReal corpus acquisition status:\n' + (corpus.read_text() if corpus.exists() else 'NOT_RUN: acquisition step did not execute') + '\n')
          PY
          exit "$status"
      - name: Upload complete evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-contract-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            perf-results/
            build-records/
            corpus-cache/status.json
            policy-corpus/policy-manifest.json
