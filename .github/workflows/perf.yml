--- 
name: perf A/B

# 性能结论只在 CI 出（同 runner、同窗口、可重复）；本地只做构建验证与测试/断言。
#
# 协议（对应 fork issue #11 的方法学审查）：
# - 每轮跑 base → head → base2（base2 与 base 同二进制）⇒ 给出"同代码路径"的真实噪声底，
#   不再拿 C 参照漂移当底（它只界住 C 那条路径的噪声）。
# - 每语料分两条 API 腿：stream（StreamingDecoder + 64KB 读循环）与 known（FrameDecoder::decode_all
#   直写调用方容量）——把"API 契约成本"与"可优化差距"分开（§3）。
# - 真实语料腿 repo-sources（checkout 内源文件按路径排序拼接，确定、无网络）（§5）。
# - 编码腿：时间 + ratio 双指标（§4）。
# - 编译配置腿：同一份 head 代码换成 lto=fat + cgu=1 + target-cpu=native（§8）。
# - 输出 runner 指纹（arch/cpu/nproc/runner）：比值是"代码 × 机器"属性，禁止跨 run 引用（§1/§6）。
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'base ref/SHA (对照侧)'
        default: 'master'
        required: false
      head_ref:
        description: 'head ref/SHA (被测侧, 空=当前 ref)'
        default: ''
        required: false
      reps:
        description: '交错轮数 (每轮 base/head/base2)'
        default: '6'
        required: false
      iters:
        description: '每轮每语料 best-of'
        default: '9'
        required: false
      size_mb:
        description: '每语料大小 (MB)'
        default: '16'
        required: false
      config_leg:
        description: '额外跑一条编译配置腿'
        default: 'true'
        required: false
      real_corpus:
        description: '跑真实语料腿（用 corpus prepare 放进缓存的语料；miss 则跳过）'
        default: 'true'
        required: false
      arm_crosscheck:
        description: '在 arm64 Linux runner 上复核 (默认关闭, 很少用到)'
        default: 'false'
        required: false
  push:
    branches:
      - 'ci-perf*'
      - 'perf/*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  ab:
    name: bench A/B (base vs head)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.arm_crosscheck == 'true') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Resolve refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.inputs.base_ref }}"; [ -z "$base" ] && base="master"
            head="${{ github.event.inputs.head_ref }}"
            [ -z "$head" ] && head="${{ github.sha }}"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          echo "reps=${{ github.event.inputs.reps || '6' }}" >> "$GITHUB_OUTPUT"
          echo "iters=${{ github.event.inputs.iters || '9' }}" >> "$GITHUB_OUTPUT"
          echo "size_mb=${{ github.event.inputs.size_mb || '16' }}" >> "$GITHUB_OUTPUT"
          echo "config_leg=${{ github.event.inputs.config_leg || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "real_corpus=${{ github.event.inputs.real_corpus || 'true' }}" >> "$GITHUB_OUTPUT"
          # 缓存 key 的 3 天轮转桶：epoch 天 / 3，跨桶即重拉语料
          echo "corpus_bucket=$(( $(date +%s) / 86400 / 3 ))" >> "$GITHUB_OUTPUT"

      - name: Checkout base (对照侧)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.base }}
          path: base
          fetch-depth: 1

      - name: Checkout head (被测侧)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.head }}
          path: head
          fetch-depth: 1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (base)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: base
      - name: Cache cargo (head)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: head

      # harness 自包含：拷进两侧，保证对照侧跑的是同一份测量代码
      # 真实语料由 corpus prepare 工作流拉好，作为**工作流 artifact** 交付：
      # artifact 不受分支作用域限制（actions/cache 的缓存按分支隔离——上一版在 corpus-prepare
      # 分支存的缓存，ci-perf-total 分支根本 restore 不到，日志里就是"缓存未命中"）。
      # 这里取 3 天内的最近一次成功 prepare，下载它的 corpus-cache artifact。
      - name: Fetch real corpus artifact (3 天内最近一次 prepare)
        if: steps.refs.outputs.real_corpus == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p corpus-cache
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "corpus prepare" --status success \
                  --limit 20 --json databaseId,createdAt \
                  --jq "[.[] | select((now - (.createdAt|fromdateiso8601)) < 259200)][0].databaseId" 2>/dev/null || true)
          if [ -z "${RUN:-}" ] || [ "$RUN" = "null" ]; then
            echo "::warning::3 天内没有 corpus prepare 的成功运行——真实语料腿跳过（先去跑 corpus prepare）"
            exit 0
          fi
          echo "用 prepare 运行 $RUN 的 artifact"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n corpus-cache -D corpus-cache \
            || echo "::warning::artifact 下载失败"
          ls -l corpus-cache || true

      - name: Share harness into base
        run: |
          mkdir -p base/ruzstd/examples
          cp head/ruzstd/examples/perf_ab.rs base/ruzstd/examples/perf_ab.rs

      - name: Build harness (base, head, head-tuned)
        run: |
          set -euo pipefail
          (cd base && cargo build --release --example perf_ab)
          (cd head && cargo build --release --example perf_ab)
          mkdir -p bins
          cp base/target/release/examples/perf_ab bins/base
          cp head/target/release/examples/perf_ab bins/head
          if [ "${{ steps.refs.outputs.config_leg }}" = "true" ]; then
            # lto/cgu 走 cargo 的 profile env 覆盖（RUSTFLAGS 里的 -C lto 会被 cargo 拒），
            # target-cpu 走 RUSTFLAGS
            (cd head && CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 \
               RUSTFLAGS="-C target-cpu=native" CARGO_TARGET_DIR=target-tuned \
               cargo build --release --example perf_ab) \
              || echo "::warning::tuned build failed, config leg skipped"
            ls -l head/target-tuned/release/examples/perf_ab || true
            cp head/target-tuned/release/examples/perf_ab bins/head_tuned 2>/dev/null || true
          fi
          ls -l bins

      - name: Interleaved rounds (base / head / base2)
        env:
          REPS: ${{ steps.refs.outputs.reps }}
          ITERS: ${{ steps.refs.outputs.iters }}
          SIZE_MB: ${{ steps.refs.outputs.size_mb }}
        run: |
          set -euo pipefail
          : > base.jsonl; : > base2.jsonl; : > head.jsonl; : > run.log
          EXTRA=""
          if [ -d corpus-cache ]; then
            for f in corpus-cache/*.bin; do
              [ -f "$f" ] || continue
              EXTRA="$EXTRA --corpus-file $f"
            done
          fi
          echo "external corpora:${EXTRA:-（无）}" >> run.log
          for i in $(seq 1 "$REPS"); do
            echo "--- round $i: base ---" >> run.log
            ./bins/base --reps 1 --iters "$ITERS" --size-mb "$SIZE_MB" --repo-dir head $EXTRA >> base.jsonl 2>> run.log
            echo "--- round $i: head ---" >> run.log
            ./bins/head --reps 1 --iters "$ITERS" --size-mb "$SIZE_MB" --repo-dir head $EXTRA >> head.jsonl 2>> run.log
            echo "--- round $i: base2 ---" >> run.log
            ./bins/base --reps 1 --iters "$ITERS" --size-mb "$SIZE_MB" --repo-dir head $EXTRA >> base2.jsonl 2>> run.log
          done
          if [ -x bins/head_tuned ]; then
            echo "--- config leg: head_tuned ---" >> run.log
            ./bins/head_tuned --reps 2 --iters "$ITERS" --size-mb "$SIZE_MB" --repo-dir head >> head_tuned.jsonl 2>> run.log
            echo "--- head_tuned.jsonl 前两行 ---" >> run.log
            head -2 head_tuned.jsonl >> run.log || true
          else
            : > head_tuned.jsonl
          fi
          echo "== 日志尾部 =="
          tail -12 run.log

      - name: Compare
        run: |
          python3 - <<'PY'
          import json, collections, os

          def load(path):
              best = collections.defaultdict(lambda: float('inf'))
              meta = {}
              for line in open(path):
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  o = json.loads(line)
                  if o.get('kind') == 'meta':
                      meta = o
                  elif o.get('kind') == 'sample':
                      key = f"{o['corpus']}|{o.get('leg','stream')}"
                      best[key + '|wall'] = min(best[key + '|wall'], o['ruzstd_ms'])
                      best[key + '|cpu'] = min(best[key + '|cpu'], o['ruzstd_cpu_ms'])
                      best[key + '|cwall'] = min(best[key + '|cwall'], o['c_ms'])
              return best, meta

          base, meta = load('base.jsonl')
          head, _ = load('head.jsonl')
          base2, _ = load('base2.jsonl')
          try:
              tuned, _ = load('head_tuned.jsonl')
          except Exception:
              tuned = {}
          enc = []
          try:
              for line in open('head.jsonl'):
                  if '"encode"' in line:
                      enc.append(json.loads(line))
          except Exception:
              pass

          out = []
          out.append(f"runner 指纹: `{meta.get('runner','?')}`   rounds={os.environ.get('REPS')} iters={os.environ.get('ITERS')} size={os.environ.get('SIZE_MB')}MB")
          out.append('')
          out.append('| corpus | leg | base wall | head wall | Δwall | base cpu | head cpu | Δcpu | base gap | head gap |')
          out.append('|---|---|---|---|---|---|---|---|---|---|')
          for key in sorted({k.rsplit('|', 1)[0] for k in base}):
              corpus, leg = key.split('|')
              bw, hw = base[key + '|wall'], head.get(key + '|wall')
              bc, hc = base[key + '|cpu'], head.get(key + '|cpu')
              bcw = base[key + '|cwall']
              hcw = head.get(key + '|cwall')
              if hw is None or hc is None:
                  continue
              out.append(f'| {corpus} | {leg} | {bw:.3f} ms | {hw:.3f} ms | {100*(hw-bw)/bw:+.2f}% | '
                         f'{bc:.3f} ms | {hc:.3f} ms | {100*(hc-bc)/bc:+.2f}% | {bw/bcw:.2f}x | {hw/hcw:.2f}x |')
          out.append('')
          out.append('**噪声底：同一二进制 base vs base2（两段交错窗口）**')
          out.append('')
          out.append('| corpus | leg | base wall | base2 wall | Δ(base2-base) wall | Δ cpu |')
          out.append('|---|---|---|---|---|---|')
          floor = 0.0
          n = 0
          for key in sorted({k.rsplit('|', 1)[0] for k in base}):
              corpus, leg = key.split('|')
              bw, b2w = base[key + '|wall'], base2.get(key + '|wall')
              if b2w is None:
                  continue
              d = 100 * (b2w - bw) / bw
              floor += abs(d); n += 1
              bc, b2c = base[key + '|cpu'], base2.get(key + '|cpu')
              dc = 100 * (b2c - bc) / bc if b2c else 0.0
              out.append(f'| {corpus} | {leg} | {bw:.3f} ms | {b2w:.3f} ms | {d:+.2f}% | {dc:+.2f}% |')
          out.append('')
          out.append(f'同代码路径平均 |Δ| ≈ **{floor/max(n,1):.2f}%**（判定阈值的下限）')
          if enc:
              out.append('')
              out.append('**编码腿（head 侧，时间 + ratio 双指标）**')
              out.append('')
              out.append('| corpus | bytes | C ms | ruzstd ms | 时间倍率 | C ratio | ruzstd ratio |')
              out.append('|---|---|---|---|---|---|---|')
              for o in enc:
                  out.append(f"| {o['corpus']} | {o['bytes']} | {o['c_ms']:.3f} | {o['ruzstd_ms']:.3f} | "
                             f"{o['ruzstd_ms']/o['c_ms']:.2f}x | {o['c_ratio']:.2f} | {o['ruzstd_ratio']:.2f} |")
          if tuned:
              out.append('')
              out.append('**编译配置腿（head 默认 vs lto=fat+cgu=1+target-cpu=native）**')
              out.append('')
              out.append('| corpus | leg | head wall | tuned wall | Δ(tuned-head) |')
              out.append('|---|---|---|---|---|')
              keys = {k.rsplit('|', 1)[0] for k in set(head) | set(tuned)}
              for key in sorted(keys):
                  corpus, leg = key.split('|')
                  hw, tw = head.get(key + '|wall'), tuned.get(key + '|wall')
                  hs = f'{hw:.3f} ms' if hw else '-'
                  ts = f'{tw:.3f} ms' if tw else '-'
                  d = f'{100*(tw-hw)/hw:+.2f}%' if (hw and tw) else '-'
                  out.append(f'| {corpus} | {leg} | {hs} | {ts} | {d} |')
          text = '\n'.join(out)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## perf A/B（交错 base/head/base2）\n\n')
              f.write(f"base=`{os.environ.get('BASE_LABEL','')}` head=`{os.environ.get('HEAD_LABEL','')}`\n\n")
              f.write(text + '\n')
          PY
        env:
          BASE_LABEL: ${{ steps.refs.outputs.base }}
          HEAD_LABEL: ${{ steps.refs.outputs.head }}
          REPS: ${{ steps.refs.outputs.reps }}
          ITERS: ${{ steps.refs.outputs.iters }}
          SIZE_MB: ${{ steps.refs.outputs.size_mb }}

      - name: Profile head (块级打点 + 每 64 序列采样)
        continue-on-error: true
        working-directory: head
        run: |
          cargo run -p ruzstd --release --quiet --features prof --example perf_ab -- \
            --profile --reps 0 --iters 1 --size-mb ${{ steps.refs.outputs.size_mb }} \
            > "$GITHUB_WORKSPACE/profile.jsonl" 2> "$GITHUB_WORKSPACE/profile.log" || true
          echo "== profile.log 尾部（诊断用）=="
          tail -5 "$GITHUB_WORKSPACE/profile.log" || true
          echo "== profile.jsonl 行数: $(wc -l < "$GITHUB_WORKSPACE/profile.jsonl" 2>/dev/null || echo 0) ==" 
          python3 - <<'PY'
          import json, os
          rows = ['| corpus | literals % | seq loop % | raw/rle/huf MB | huf 段 4/1-stream | seqs | in-loop FSE / litcopy / matchcopy % |',
                  '|---|---|---|---|---|---|']
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'profile.jsonl')
          try:
              fh = open(path)
          except FileNotFoundError:
              fh = []
          for line in fh:
              line = line.strip()
              if not line.startswith('{'):
                  continue
              o = json.loads(line)
              if o.get('kind') != 'profile':
                  continue
              rows.append(f"| {o['corpus']} | {o['literals_pct']} | {o['seq_loop_pct']} | "
                          f"{o.get('lit_raw_mb','?')}/{o.get('lit_rle_mb','?')}/{o['lit_huf_mb']} | "
                          f"{o['huf4_sections']}/{o['huf1_sections']} | {o['seqs']} | "
                          f"{o['inloop_fse_pct']} / {o['inloop_litcopy_pct']} / {o['inloop_matchcopy_pct']} |")
          out = '\n'.join(rows)
          print(out)

          # ---- p13 单位成本账（可消除性预算）：把"还差多少"拆成每序列/每字面量字节 ----
          import collections
          def best(path_):
              b = collections.defaultdict(lambda: float('inf'))
              for line in open(path_):
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  o = json.loads(line)
                  if o.get('kind') != 'sample':
                      continue
                  k = f"{o['corpus']}|{o.get('leg','stream')}"
                  b[k + '|wall'] = min(b[k + '|wall'], o['ruzstd_ms'])
                  b[k + '|c'] = min(b[k + '|c'], o['c_ms'])
              return b
          ws = os.environ['GITHUB_WORKSPACE']
          try:
              H = best(os.path.join(ws, 'head.jsonl'))
              B = best(os.path.join(ws, 'base.jsonl'))
          except Exception:
              H, B = {}, {}
          bud = ['| corpus | 主导段 | head ms | C ms | 剩余 excess ms | seqs | ns/seq(head) | ns/seq(C) | huf MB | ns/lit-B(head) |',
                 '|---|---|---|---|---|---|---|---|---|---|']
          for line in open(path):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              o = json.loads(line)
              if o.get('kind') != 'profile':
                  continue
              c = o['corpus']
              hw = H.get(c + '|stream|wall')
              hc = H.get(c + '|stream|c')
              bw = B.get(c + '|stream|wall')
              if hw is None or hc is None:
                  continue
              seqs = o.get('seqs') or 0
              litmb = (o.get('lit_huf_mb') or 0) + (o.get('lit_raw_mb') or 0) + (o.get('lit_rle_mb') or 0)
              main = 'literals' if (o.get('literals_pct') or 0) >= 50 else 'seq-loop'
              ns_seq_h = f'{1e6*hw/seqs:.2f}' if seqs else '-'
              ns_seq_c = f'{1e6*hc/seqs:.2f}' if seqs else '-'
              ns_lit_b = f'{1e6*(o.get("literals_pct",0)/100)*hw/(litmb*1048576):.3f}' if litmb else '-'
              bud.append(f"| {c} | {main} | {hw:.3f} | {hc:.3f} | {hw-hc:.2f} | {seqs} | {ns_seq_h} | {ns_seq_c} | "
                         f"{litmb:.2f} | {ns_lit_b} |")
          bud.append('')
          bud.append('契约成本=|head known − head stream|（实测 ≈0）；配置份额：见配置腿（default 更快 ⇒ 0）。')
          bud.append('⇒ 剩余差距 100% 落在两个叶子循环上（熵解码 / 每序列拷贝与切片调用），可消除量只来自每单位指令数。')
          budtxt = '\n'.join(bud)
          print(budtxt)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n## 解码相位归因（head 侧；块级打点 + 每 64 序列采样，只看占比）\n\n')
              f.write(out + '\n')
              f.write('\n## 单位成本账 / 可消除性预算（p13）\n\n')
              f.write(budtxt + '\n')
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-logs
          path: |
            base.jsonl
            base2.jsonl
            head.jsonl
            head_tuned.jsonl
            run.log
            profile.jsonl
            profile.log
