name: performance contract

on:
  push:
    branches: [master, integration-green, 'test/perf-contract', 'perf/*', 'ci-perf*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: experiment contracts and locked harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install workflow parser (test-only dependency)
        run: python3 -m pip install 'PyYAML==6.0.3'
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Offline synthetic contract and topology regressions
        run: python3 -B -m unittest discover -s tools/tests -p 'test_perf_*.py' -v
      - name: Formatting contract; retain exact patch on failure
        run: |
          cargo +nightly fmt --all
          cargo +nightly fmt --manifest-path tools/perf/harness/Cargo.toml
          git diff --binary > formatter.patch
          git diff --exit-code
      - name: Explicit nonempty codec oracle (dictionary feature is mandatory)
        run: cargo test -p ruzstd --features dict_builder --test cross_validate --test direct_output_miri
      - name: Real locked Rust harness unit tests
        run: cargo test --locked --manifest-path tools/perf/harness/Cargo.toml
      - name: Upload exact formatting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatter-${{ github.run_id }}-${{ github.run_attempt }}
          path: formatter.patch
          if-no-files-found: warn
